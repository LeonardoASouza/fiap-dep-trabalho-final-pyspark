[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pedidos_recusados"
version = "1.0.0"
description = "Relatorio de pedidos de venda com pagamento recusado e avaliacao de fraude legitima (PySpark + POO + Injecao de Dependencias)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Arthur Oliveira Araujo" },
  { name = "Helen Jeronimo Martins" },
  { name = "Joyce Paduan de Souza Maciel" },
  { name = "Julio Mateus Costa da Silva" },
  { name = "Leonardo de Almeida Souza" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pyspark>=4.2.0,<5.0.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
  "build>=1.2.0",
]

[project.scripts]
run-pedidos-recusados = "pedidos_recusados.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
markers = [
  "unit: testes unitarios",
  "integration: testes de integracao do pipeline",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
